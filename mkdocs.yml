# Project information
site_name: MPM for Net Zero
site_url: https://durhamarc.github.io/mpm-netzero
site_author: Durham University
site_description: >-
  Leveraging the Material Point Method for large deformation soil-structure
  interaction to realise Net Zero through offshore renewable energy

# Repository
repo_name: mpm-netzero
repo_url: https://github.com/DurhamARC/mpm-netzero

# Copyright
copyright: Copyright &copy; 2025 Durham University | UKRI Project Reference UKRI788

# Theme
theme:
  name: material
  palette:
    primary: custom
    accent: custom
  font:
    text: Open Sans
    code: Roboto Mono
  features:
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.top
    - toc.integrate

# Navigation
nav:
  - Home: index.md
  - About:
      - Project Overview: about/overview.md
      - Technical Approach: about/approach.md
      - Applications: about/applications.md
  - Partners: partners.md
  - AMPSSIE:
      - Introduction: docs/Introduction.md
      - Getting Started:
          - Overview: docs/GettingStarted/GettingStarted.md
          - Installation: docs/GettingStarted/Installation.md
          - Quick Start: docs/GettingStarted/Quickstart.md
      - Using the software: docs/UsingTheSoftware.md
      - Tutorial problems: docs/TutorialProblems.md
      - Understanding the software: docs/Understanding.md
      - Technical reference: docs/TechnicalReference.md
      - Contributors: docs/Contributors.md
  - Coming soon: docs/ComingSoon.md
  - Contact: contact.md

# Plugins
plugins:
  - search
  - caption
  - bibtex:
      bib_file: "docs/refs.bib"

# Custom CSS
extra_css:
  - stylesheets/extra.css

# MathJax
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
