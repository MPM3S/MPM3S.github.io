# Project information
site_name: MPM3S
site_url: https://mpm3s.github.io/
site_author: Durham University
site_description: >-
  MPM3S: software for large-deformation soil-structure interaction using the
  Material Point Method

# Repository
repo_name: MPM3S.jl
repo_url: https://github.com/MPM3S/MPM3S.jl

# Copyright
copyright: Copyright &copy; 2025 Durham University | UKRI Project Reference UKRI788

# mkdocs serve rebuilds when a shared snippet (--8<-- "file.md") changes, not only a page
watch:
  - includes

# Theme
theme:
  name: material
  logo: img/mkdocs/logo.png
  favicon: img/mkdocs/logo.png
  palette:
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    
# Navigation
# The software's pages, then the project's. The site's root opens the Introduction (redirects below);
# the old home page is project.md. The sidebar icons follow this order (stylesheets/theme.css), so move
# an icon there when a top-level entry moves.
nav:
  - Introduction: docs/Introduction.md
  - Install and run:
      - Overview: docs/GettingStarted/install_and_run.md
      - Julia (PC): docs/GettingStarted/julia.md
      - Docker and containers:
          - Overview: docs/GettingStarted/containers.md
          - Singularity / Apptainer: docs/GettingStarted/singularity.md
          - Docker: docs/GettingStarted/docker.md
      - HPC (Slurm):
          - Overview: docs/GettingStarted/hpc.md
          - With the container: docs/GettingStarted/hpc_container.md
          - Installed with Julia: docs/GettingStarted/hpc_julia.md
      - Cloud computing: docs/GettingStarted/cloud.md
      - Viewing the output: docs/GettingStarted/viewing_output.md
  - Tutorial problems:
      - Overview: docs/TutorialProblems/TutorialProblems.md
      - Static:
          - Self-weight column: docs/TutorialProblems/Tutorial_1.md
          - compaction via a rigid body: docs/TutorialProblems/Tutorial_2.md
          - Vertical penetration: docs/TutorialProblems/Tutorial_3.md
          # - plough: docs/TutorialProblems/Tutorial_4.md
      - Dynamic:
          - Rolling sphere: docs/TutorialProblems/Tutorial_5.md
          - Drag anchor: docs/TutorialProblems/Tutorial_6.md
      - Reference input data:
          - Self-weight column: docs/TutorialProblems/Tutorial_1_input_data.md
          - Compaction via a rigid body: docs/TutorialProblems/Tutorial_2_input_data.md
          - Vertical penetration: docs/TutorialProblems/Tutorial_3_input_data.md
          # - Plough: docs/TutorialProblems/Tutorial_4_input_data.md
          - Rolling sphere: docs/TutorialProblems/Tutorial_5_input_data.md
          - Drag anchor: docs/TutorialProblems/Tutorial_6_input_data.md
  - Using the software:
      - Overview: docs/UsingTheSoftware/InputFormat/index.md
      - GPU: docs/UsingTheSoftware/InputFormat/gpu.md
      - Domain: docs/UsingTheSoftware/InputFormat/domain.md
      - Material points: docs/UsingTheSoftware/InputFormat/material_points.md
      - Rigid bodies: docs/UsingTheSoftware/InputFormat/rigid_bodies.md
      - Contact properties: docs/UsingTheSoftware/InputFormat/contact.md
      - Analysis stages: docs/UsingTheSoftware/InputFormat/analysis.md
      - Solver: docs/UsingTheSoftware/InputFormat/solver.md
      - Output: docs/UsingTheSoftware/InputFormat/output.md
      - Obtaining results: docs/UsingTheSoftware/ObtainingResults.md 
  - Interactive builder: docs/UsingTheSoftware/input_builder.md
  - Technical reference:
      - Overview: docs/TechnicalReferences/TechnicalReference.md
      - Material point method basics:
          - Material Point Method overview: docs/TechnicalReferences/MPMoverview.md
      - Large deformation formulation:
          - Kinematics: docs/TechnicalReferences/Kinematics.md
          - Stress and strain measures: docs/TechnicalReferences/StressStrain.md
          - Equilibrium equations: docs/TechnicalReferences/EquilibriumEquations.md
          - Equilibrium with rigid-body contact: docs/TechnicalReferences/EquilibriumEquationsContact.md
      - Material models:
          - Overview: docs/TechnicalReferences/ConstitutiveModels.md
          - Isotropic linear elasticity: docs/TechnicalReferences/LinearElasticity.md
          - Isotropic elasto-plasticity: docs/TechnicalReferences/ElastoPlasticity.md
      - Small cut instability:
          - Ghost stabilisation: docs/TechnicalReferences/ghostStabilisation.md
      # - Static weak form: docs/TechnicalReferences/StaticWeakForm.md
      # - Static weak form with normal contact: docs/TechnicalReferences/StaticWeakFormNormalContact.md
  - Understanding the software: docs/Understanding.md
  - Contributors: docs/Contributors.md
  - About the project: project.md
  - Partners: partners.md
  - Coming soon: docs/ComingSoon.md
  - Contact: contact.md

# the old "About" section, kept in the repository but not built into this site
exclude_docs: |
  /about/

# Plugins
plugins:
  - search
  - social:                                       # the preview card (og:image) when a page's link is shared
      cards_layout_options:
        background_color: "#68246d"               # Durham purple
        color: "#ffffff"
  - caption:
      figure:
        ignore_classes: ["gif-box", "card-gif"]   # the tutorial animations are not numbered figures
  - bibtex:
      bib_file: "docs/refs.bib"
  - redirects:
      redirect_maps:
        index.md: docs/Introduction.md

# Custom CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/theme.css

# MathJax + per-page enhancements
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/julia-repl-colors.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:            # --8<-- "file.md" pastes a shared block, e.g. the terminal window on each install page
      base_path: [includes]
      check_paths: true
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
